<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="student-dashboard.css" />
</head>
<body>
  <nav class="top-navbar">
    <div class="container">
      <a href="landing.html">Home</a>
      <a href="student-dashboard.html">Student Dashboard</a>
      <a href="student-player.html">Course Player</a>
    </div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar p-3">
      <h4 class="text-white mb-4">Student Panel</h4>
      <ul class="nav flex-column gap-2" id="sidebarNav">
        <li class="nav-item"><button class="nav-link active" data-section="dashboardSection">Dashboard</button></li>
        <li class="nav-item"><button class="nav-link" data-section="allCoursesSection">All Courses</button></li>
        <li class="nav-item"><button class="nav-link" data-section="myCoursesSection">My Courses</button></li>
      </ul>
    </aside>

    <main class="content-area">
      <nav class="navbar bg-white border-bottom px-3">
        <span class="navbar-brand mb-0 h1">Student Dashboard</span>
      </nav>

      <div class="container-fluid p-4">
        <section id="dashboardSection" class="page-section">
          <div class="mb-4">
            <h2 class="h4 mb-2">Welcome back, Student</h2>
            <p class="text-muted mb-0">Track your progress and continue learning from your courses.</p>
          </div>

          <div class="row g-3">
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Enrolled Courses</p>
                  <h3 class="mb-0" id="enrolledCount">0</h3>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Completed Courses</p>
                  <h3 class="mb-0" id="completedCount">0</h3>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Ongoing Courses</p>
                  <h3 class="mb-0" id="ongoingCount">0</h3>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="allCoursesSection" class="page-section d-none">
          <h2 class="h5 mb-3">All Courses</h2>
          <div id="allCoursesGrid" class="row g-3"></div>
        </section>

        <section id="myCoursesSection" class="page-section d-none">
          <h2 class="h5 mb-3">My Courses</h2>
          <div id="myCoursesGrid" class="row g-3"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="student-dashboard.js"></script>
</body>
</html>
