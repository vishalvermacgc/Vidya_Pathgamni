<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Player</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="student-player.css" />
</head>
<body>
  <nav class="top-navbar">
    <div class="container">
      <a href="landing.html">Home</a>
      <a href="student-dashboard.html">Student Dashboard</a>
      <a href="student-player.html">Course Player</a>
    </div>
  </nav>
  <nav class="navbar bg-white border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Course Player</span>
    <a href="student-dashboard.html" class="btn btn-outline-primary btn-sm">Back to Dashboard</a>
  </nav>

  <main class="container-fluid p-3 p-md-4">
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 mb-3" id="courseTitle">Course</h2>
            <div id="chapterList" class="list-group"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h3 class="h5 mb-3" id="chapterTitle">Select a chapter</h3>
            <div class="ratio ratio-16x9 mb-3">
              <iframe
                id="playerFrame"
                src=""
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>
            <a id="notesLink" href="#" target="_blank" rel="noreferrer" class="btn btn-outline-secondary">
              View Notes
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="student-player.js"></script>
</body>
</html>
