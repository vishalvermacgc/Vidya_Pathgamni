<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="teacher-dashboard.css" />
</head>
<body>
  <nav class="top-navbar">
    <div class="container">
      <a href="landingpage.html">Home</a>
      <a href="teacher-dashboard.html">Teacher Dashboard</a>
    </div>
  </nav>
  <div class="dashboard-layout">
    <aside class="sidebar p-3">
      <h4 class="text-white mb-4">Teacher Panel</h4>
      <ul class="nav flex-column gap-2" id="sidebarNav">
        <li class="nav-item"><button class="nav-link active" data-section="dashboardSection">Dashboard</button></li>
        <li class="nav-item"><button class="nav-link" data-section="myCoursesSection">My Courses</button></li>
        <li class="nav-item"><button class="nav-link" data-section="addCourseSection">Add Course</button></li>
        <li class="nav-item"><button class="nav-link" data-section="addChapterSection">Add Chapters</button></li>
      </ul>
    </aside>

    <main class="content-area">
      <nav class="navbar navbar-expand-lg bg-white border-bottom px-3">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">Teacher Dashboard</span>
        </div>
      </nav>

      <div class="container-fluid p-4">
        <section id="dashboardSection" class="dashboard-section">
          <div class="mb-4">
            <h2 class="h4 mb-2">Welcome back, Teacher</h2>
            <p class="text-muted mb-0">Manage your courses, chapters, and students from one place.</p>
          </div>

          <div class="row g-3" id="statsRow">
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Total Courses</p>
                  <h3 class="mb-0" id="totalCoursesStat">0</h3>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Total Students</p>
                  <h3 class="mb-0" id="totalStudentsStat">0</h3>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                  <p class="text-muted mb-1">Total Chapters</p>
                  <h3 class="mb-0" id="totalChaptersStat">0</h3>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="addCourseSection" class="dashboard-section d-none">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h5 mb-3">Add Course</h2>
              <form id="addCourseForm" class="row g-3">
                <div class="col-12">
                  <label for="courseTitle" class="form-label">Course Title</label>
                  <input type="text" class="form-control" id="courseTitle" required />
                </div>
                <div class="col-12">
                  <label for="courseDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="courseDescription" rows="4" required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Create Course</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section id="addChapterSection" class="dashboard-section d-none">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h5 mb-3">Add Chapter</h2>
              <form id="addChapterForm" class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="chapterCourseSelect" class="form-label">Select Course</label>
                  <select class="form-select" id="chapterCourseSelect" required></select>
                </div>
                <div class="col-12 col-md-6">
                  <label for="chapterTitle" class="form-label">Chapter Title</label>
                  <input type="text" class="form-control" id="chapterTitle" required />
                </div>
                <div class="col-12 col-md-6">
                  <label for="youtubeUrl" class="form-label">YouTube URL</label>
                  <input type="url" class="form-control" id="youtubeUrl" required />
                </div>
                <div class="col-12 col-md-6">
                  <label for="documentLink" class="form-label">Document Link</label>
                  <input type="url" class="form-control" id="documentLink" required />
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Add Chapter</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section id="myCoursesSection" class="dashboard-section d-none">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">My Courses</h2>
          </div>
          <div id="myCoursesGrid" class="row g-3"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="teacher-dashboard.js"></script>
</body>
</html>
